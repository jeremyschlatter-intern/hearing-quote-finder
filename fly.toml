app = 'leg-tech-hearing-quote-finder'
primary_region = 'iad'

[build]

[env]
  DB_DIR = '/data'

[mounts]
  source = 'hearing_quotes_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
